name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Console entry point
        run: ai-kit --help
      - name: Module entry point
        run: python -m ai_kit
      - name: Editable install from another directory
        run: python -c "import shutil,subprocess,tempfile; exe=shutil.which('ai-kit'); assert exe; r=subprocess.run([exe,'prompt'], cwd=tempfile.mkdtemp(), capture_output=True, text=True); assert r.returncode == 0, r.stderr"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Profile
        run: python -m ai_kit.profile --check profiles/example.toml
      - name: Templates
        run: python -m ai_kit.templates --check
      - name: Interview
        run: python -m ai_kit.interview --check --adapter tests/fixtures/adapter/adapter.toml
      - name: Generator dry run
        run: python -m ai_kit.init --profile profiles/example.toml --adapter tests/fixtures/adapter/adapter.toml --dry-run
      - name: Launcher
        run: python -m ai_kit.prompt
      - name: Non-editable install is rejected
        run: |
          python -m pip install . --force-reinstall --disable-pip-version-check
          python -c "import subprocess,sys,tempfile; r=subprocess.run([sys.executable,'-m','ai_kit.prompt'], cwd=tempfile.mkdtemp(), capture_output=True, text=True); assert r.returncode == 2, r.returncode; assert 'editable' in r.stderr"
