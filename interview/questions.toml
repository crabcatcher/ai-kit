# Банк универсальных вопросов. Стековые вопросы добавляет адаптер (не больше пяти).
# Всего после дедупликации — не больше пятнадцати.
# example и hint — для человеческой анкеты: агент не показывает слоты и типы.

[[question]]
id = "purpose"
question = "Как называется проект, зачем он существует и что считается успехом?"
slots = ["project.name", "project.purpose"]
why = "без имени и назначения документы описывают код, а не решения"
example = "Медицинская информационная система для поликлиник: ведёт пациентов, расписание врачей, обмен с лабораториями. Успех — врач находит карту пациента за минуту."
hint = "2–3 предложения: кто пользуется, какую задачу решает и что должно работать."

[[question]]
id = "boundaries"
question = "Что в проект не входит и какие решения приняты вне его?"
slots = ["project.boundaries"]
why = "границы задают, что не делать; без них объём растёт"
example = "Не входит: мобильное приложение, биллинг, сервисы другой команды. Биллинг решает финансовая команда."
hint = "Список пунктов: чего нет в репозитории и где принимаются внешние решения."

[[question]]
id = "stack"
question = "Какой язык, фреймворки, хранилища и инструменты? Укажите манифесты — версии возьмём оттуда."
slots = ["stack.runtime", "stack.frameworks", "stack.stores", "stack.tools"]
why = "стек — данные проекта; версии подтверждаются файлами, а не памятью"
example = "Язык и версия, фреймворк, база данных и инструменты; версии — из манифеста и конфигурации."
hint = "Перечисли роли; операционная система и окружение машины не нужны."

[[question]]
id = "layout"
question = "Где лежит исходный код и какие каталоги считаются корневыми?"
slots = ["layout.source_roots"]
why = "без корней проверки и ссылки не находят цели"
example = "Исходники в app/ и packages/; конфигурация и миграции рядом."
hint = "Список каталогов, где лежит код; подтверди или поправь предложенные."

[[question]]
id = "layers"
question = "Какие границы зависимостей действуют: что может зависеть от чего?"
slots = ["layout.layers"]
why = "направление зависимостей нельзя вывести из названий каталогов; его надо подтвердить"
example = "Контроллер → сервис → репозиторий; модель — данные; приложения не зависят друг от друга."
hint = "Неочевидная архитектура — docs/question-style.md: типовое для стека и дефолт."

[[question]]
id = "tests"
question = "Чем запускаются проверки и какие роли команд есть: тесты, линт, сборка?"
slots = ["tests.framework", "tests.commands"]
why = "ссылки в шаблонах должны указывать на существующие команды"
example = "Тесты: make test, линт: make lint, сборка: make build."
hint = "Роли команд: тест, юнит, e2e, линт, сборка, миграции."

[[question]]
id = "branches"
question = "Какая схема веток?"
slots = ["process.branches"]
why = "без схемы название ветки ничего не говорит о задаче"
example = "main, develop и ветки feature/* от develop; hotfix/* от main."
hint = "Назови основную ветку и от каких веток создаются рабочие."

[[question]]
id = "review"
question = "Кто исполняет критику плана и ревью: человек, отдельная сессия, агент?"
slots = ["process.review_roles"]
why = "роль без исполнителя — пожелание"
example = "Сначала отдельная сессия агента, затем человек; блокеры — у человека."
hint = "Кто и в каком порядке проверяет план и изменение."

[[question]]
id = "tiers"
question = "Нужны ли уровни задачи: мелкая правка без плана, крупная с декомпозицией?"
slots = ["process.tiers"]
why = "полный маршрут на правку строки дороже задачи"
example = "Да: T0 для правок без поведения, T2 для нескольких слоёв."
hint = "true/false и короткое объяснение, если уровни нужны."

[[question]]
id = "clients"
question = "Есть ли агент-клиент и какие ограничения у него в правах?"
slots = ["automation.clients"]
why = "границы харнесса задаёт конфиг, а не документ"
example = "Разработчики и агент в IDE; git и docker — можно, сеть и файлы вне проекта — по запросу."
hint = "Кто работает с репозиторием и какие права ограничены."

[[question]]
id = "ci"
question = "Какая непрерывная проверка и есть ли проверка перед коммитом?"
slots = ["automation.ci", "automation.pre_commit"]
why = "гейт без места запуска не останавливает ничего"
example = "CI нет, всё запускается локально; pre-commit включаем."
hint = "Есть ли конвейер, где конфигурация, и нужен ли хук."

[[question]]
id = "access"
question = "Какие уровни доступа есть и как обращаетесь с секретами?"
slots = ["security.access_levels", "security.secrets_policy"]
why = "доступ и секреты — то, что нельзя достроить догадкой"
example = "Роли ADMIN и USER; секреты лежат в .env и не попадают в git."
hint = "Список ролей из кода и правило обращения с секретами."
